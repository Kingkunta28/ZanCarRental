          <a href="#terms" data-i18n="nav_terms"></a>

        <div class="tools">
          <select class="lang" id="lang" aria-label="Language">

            <option value="de">DE</option>
            <option value="fr">FR</option>
            <option value="es">ES</option>

            aria-label="Menu"
            aria-controls="nav"
            aria-expanded="false"

            <span></span><span></span>

    <main id="main">
      <!-- ============ Hero ============ -->
      <section class="hero">
        <div class="hero-bg" aria-hidden="true"></div>
        <div class="blob b1" aria-hidden="true"></div>
        <div class="blob b2" aria-hidden="true"></div>

        <div class="wrap hero-grid">
          <div class="hero-copy">
            <p class="kicker">
              <span class="pulse" aria-hidden="true"></span
              ><span data-i18n="hero_kicker"></span>
            </p>
            <h1 data-i18n="h1"></h1>
            <p class="hero-p" data-i18n="hero_p"></p>
            <div class="hero-cta">
              <a class="btn btn-sand lg" href="#book"
                ><span data-i18n="cta_book"></span>
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6" /></svg
              ></a>
              <a
                class="btn btn-glass lg"
                href="#fleetsec"
                data-i18n="cta_fleet"
              ></a>
            </div>
            <ul class="trust">
              <li data-i18n="w1t"></li>
              <li data-i18n="w3t"></li>
              <li data-i18n="w4t"></li>
            </ul>
          </div>

          <div class="hero-visual" aria-hidden="true">
            <div class="sun"></div>
            <img
              class="hero-car"
              src="images/Toyota Land Cruiser.png"
              alt=""
              width="612"
              height="408"
            />
            <div class="float-chip chip-a">
              <small data-i18n="stat_from"></small>
              <b id="heroFrom"></b>
            </div>
            <div class="float-chip chip-b">
              <span class="chip-ic">✈</span><span data-i18n="w2t"></span>
            </div>
          </div>
        </div>

        <div class="wrap">
          <dl class="stats">
            <div>
              <dt><b id="statCars" data-count="0">0</b></dt>
              <dd data-i18n="stat_cars"></dd>
            </div>
            <div>
              <dt><b id="statFrom" data-count="0" data-dec="0">0</b></dt>
              <dd data-i18n="stat_from"></dd>
            </div>
            <div>
              <dt><b>24/7</b></dt>
              <dd data-i18n="stat_support"></dd>
            </div>
          </dl>
        </div>

        <div class="waves w3" aria-hidden="true"></div>
        <div class="waves w1" aria-hidden="true"></div>
        <div class="waves w2" aria-hidden="true"></div>
      </section>

      <!-- ============ How it works ============ -->
      <section class="how" id="how">
        <div class="wrap">
          <div class="sec-head center reveal">
            <h2 data-i18n="how_h"></h2>
            <p class="lead" data-i18n="how_p"></p>
          </div>
          <ol class="steps">
            <li class="step reveal" style="--i: 0">
              <span class="step-n">01</span>
              <span class="step-ic" aria-hidden="true"
                ><svg viewBox="0 0 24 24">
                  <path
                    d="M5 17h14M6 17l1.5-5.5A2 2 0 0 1 9.4 10h5.2a2 2 0 0 1 1.9 1.5L18 17M5 17v2M19 17v2"
                  />
                  <circle cx="8" cy="14.5" r=".8" />
                  <circle cx="16" cy="14.5" r=".8" /></svg
              ></span>
              <h3 data-i18n="s1t"></h3>
              <p data-i18n="s1p"></p>
            </li>
            <li class="step reveal" style="--i: 1">
              <span class="step-n">02</span>
              <span class="step-ic" aria-hidden="true"
                ><svg viewBox="0 0 24 24">
                  <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
                  <path d="M8 11h.01M12 11h.01M16 11h.01" /></svg
              ></span>
              <h3 data-i18n="s2t"></h3>
              <p data-i18n="s2p"></p>
            </li>
            <li class="step reveal" style="--i: 2">
              <span class="step-n">03</span>
              <span class="step-ic" aria-hidden="true"
                ><svg viewBox="0 0 24 24">
                  <path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z" />
                  <circle cx="12" cy="10" r="2.5" /></svg
              ></span>
              <h3 data-i18n="s3t"></h3>
              <p data-i18n="s3p"></p>
            </li>
          </ol>
        </div>
      </section>

      <!-- ============ Fleet ============ -->
      <section class="fleet" id="fleetsec">
        <div class="wrap">
          <div class="sec-head split reveal">
            <div>
              <h2 data-i18n="fleet_h"></h2>
              <p class="lead" data-i18n="fleet_p"></p>
            </div>
            <div
              class="filters"
              id="filters"
              role="group"
              aria-label="Filter"
            ></div>
          </div>
          <div class="grid" id="fleet" aria-live="polite"></div>
        </div>
      </section>

      <!-- ============ Booking ============ -->
      <section class="book" id="book">
        <div class="wrap">
          <div class="sec-head reveal">
            <h2 data-i18n="book_h"></h2>
            <p class="lead" data-i18n="book_p"></p>
          </div>

          <div class="book-grid reveal">
            <form id="form" class="formcard" novalidate>
              <div class="fields">
                <label>
                  <span data-i18n="f_name"></span>
                  <input name="name" autocomplete="name" required />
                </label>
                <label>
                  <span data-i18n="f_phone"></span>
                  <input
                    name="phone"
                    type="tel"
                    autocomplete="tel"
                    placeholder="+255 ..."
                    required
                  />
                </label>
                <label class="full">
                  <span data-i18n="f_car"></span>
                  <select name="car" id="car" required></select>
                </label>
                <label>
                  <span data-i18n="f_pick"></span>
                  <input name="from" id="from" type="date" required />
                </label>
                <label>
                  <span data-i18n="f_ret"></span>
                  <input name="to" id="to" type="date" required />
                </label>
                <label>
                  <span class="lbl"
                    ><span data-i18n="f_loc"></span
                    ><em class="fee-pill" id="pickupFeePill"></em
                  ></span>
                  <select
                    name="pickup_loc"
                    id="pickupLoc"
                    class="loc-select"
                    required
                  ></select>
                </label>
                <label>
                  <span data-i18n="f_place"></span>
                  <input name="place" data-ph="f_place" />
                </label>
                <label>
                  <span class="lbl"
                    ><span data-i18n="f_ret_loc"></span
                    ><em class="fee-pill" id="returnFeePill"></em
                  ></span>
                  <select
                    name="return_loc"
                    id="returnLoc"
                    class="loc-select"
                    required
                  ></select>
                </label>
                <label>
                  <span data-i18n="f_ret_place"></span>
                  <input name="return_place" data-ph="f_ret_place" />
                </label>
                <p class="full fee-note" id="feeNote"></p>
                <label class="full">
                  <span data-i18n="f_notes"></span>
                  <textarea name="notes" rows="3"></textarea>
                </label>
              </div>
              <p class="msg" id="msg" role="status" aria-live="polite"></p>
            </form>

            <aside class="summary" aria-labelledby="sumTitle">
              <h3 id="sumTitle" data-i18n="sum_h"></h3>
              <div class="sum-media">
                <img id="estImg" alt="" hidden />
                <div class="sum-ph" id="sumPh" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M5 17h14M6 17l1.5-5.5A2 2 0 0 1 9.4 10h5.2a2 2 0 0 1 1.9 1.5L18 17M5 17v2M19 17v2"
                    />
                  </svg>
                </div>
              </div>
              <p class="sum-car">
                <b id="sumCar"></b><span id="sumRate"></span>
              </p>
              <dl class="sum-rows" id="sumTrip"></dl>
              <dl class="sum-rows sum-money" id="sumMoney"></dl>
              <div class="sum-total">
                <span data-i18n="sum_total"></span>
                <strong id="total">—</strong>
              </div>
              <p class="sum-hint" id="sumHint"></p>
              <button
                class="btn btn-wa big"
                id="sendBtn"
                type="submit"
                form="form"
              >
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
                </svg>
                <span data-i18n="send"></span>
              </button>
              <p class="small" data-i18n="note"></p>
            </aside>
          </div>
        </div>
      </section>

      <!-- ============ Why us ============ -->
      <section class="why-sec">
        <div class="wrap">
          <div class="sec-head reveal">
            <h2 data-i18n="why_h"></h2>
            <p class="lead" data-i18n="why_p"></p>

          <div class="bento">
            <article class="b-card b-feature reveal" style="--i: 0">
              <div class="b-copy">
                <span class="b-ic" aria-hidden="true"

            </article>
            <article class="b-card reveal" style="--i: 1">
              <span class="b-ic" aria-hidden="true"
                ><svg viewBox="0 0 24 24">
                  <path
                    d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"
                  />
                  <circle cx="7.5" cy="7.5" r="1.2" /></svg
              ></span>
              <h3 data-i18n="w1t"></h3>
              <p data-i18n="w1p"></p>
            </article>
            <article class="b-card reveal" style="--i: 2">
              <span class="b-ic" aria-hidden="true"
                ><svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M12 6v6l4 2" /></svg
              ></span>
              <h3 data-i18n="w3t"></h3>
              <p data-i18n="w3p"></p>
            </article>
            <article class="b-card b-wide reveal" style="--i: 3">
              <span class="b-ic" aria-hidden="true"
                ><svg viewBox="0 0 24 24">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
                  <path d="m9 12 2 2 4-4" /></svg
              ></span>
              <div>
                <h3 data-i18n="w4t"></h3>
                <p data-i18n="w4p"></p>
              </div>
            </article>
          </div>
        </div>
      </section>

      <!-- ============ Reviews ============ -->
      <section class="reviews-sec">
        <div class="wrap">
          <div class="sec-head center reveal">
            <h2 data-i18n="rev_h"></h2>

          <div class="reviews">

      <section class="guide" id="guide">
        <div class="wrap">
          <div class="sec-head center reveal">

            <h2 data-i18n="g_h"></h2>

          <ol class="g-grid">

              <span class="g-n" aria-hidden="true">01</span>

            </li>
            <li class="g-card reveal" style="--i: 2">
              <span class="g-n" aria-hidden="true">03</span>
              <h3 data-i18n="g3t"></h3>

            <li class="g-card reveal" style="--i: 3">

              <h3 data-i18n="g4t"></h3>
              <p data-i18n="g4p"></p>
            </li>
            <li class="g-card reveal" style="--i: 4">

            <li class="g-card reveal" style="--i: 5">

              <h3 data-i18n="g6t"></h3>

            </li>
            <li class="g-card reveal" style="--i: 6">
              <span class="g-n" aria-hidden="true">07</span>
              <h3 data-i18n="g7t"></h3>
              <p data-i18n="g7p"></p>
            </li>
          </ol>

      <!-- ============ Terms + FAQ ============ -->
      <section class="info">
        <div class="wrap info-grid">
          <div class="terms-card reveal" id="terms">
            <h2 data-i18n="terms_h"></h2>
            <ul class="terms">
              <li data-i18n="tm1"></li>

    <!-- ============ Footer ============ -->
    <footer id="contact">
      <div class="wrap">
        <div class="cta-band reveal">
          <div>
            <h2 data-i18n="cta_h"></h2>
            <p data-i18n="contact_p"></p>
          </div>
          <div class="cta-actions">
            <a class="btn btn-sand lg" href="#book" data-i18n="cta_book"></a>
            <a class="btn btn-wa lg" data-wa data-i18n="wa"></a>
          </div>
        </div>

        <div class="foot-grid">
          <div class="foot-brand">
            <a class="foot-logo" href="#top"><img src="images/logo.webp" alt="Rafiki Car Hire, Drive Zanzibar with Confidence" width="760" height="582" loading="lazy" /></a>
            <p data-i18n="hero_p"></p>
          </div>
          <nav class="foot-links" aria-label="Footer">
            <h3 data-i18n="foot_explore"></h3>
            <a href="#fleetsec" data-i18n="nav_fleet"></a>

          <div class="foot-contact">
            <h3 data-i18n="contact_h"></h3>

          </div>
        </div>

        <p class="copy">
          © <span id="year"></span> <span data-biz></span>.
          <span data-i18n="rights"></span>
        </p>
      </div>

    <!-- Car details modal -->
    <dialog class="modal" id="carModal" aria-labelledby="mTitle">
      <div class="modal-box">
        <button
          class="modal-x"
          type="button"
          data-close
          data-i18n-label="close"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
        <div class="modal-media"><img id="mImg" alt="" /></div>
        <div class="modal-body">
          <span class="tag" id="mType"></span>
          <h3 id="mTitle"></h3>
          <ul class="specs" id="mSpecs"></ul>
          <div class="modal-foot">
            <p class="price" id="mPrice"></p>
            <a class="btn btn-b" href="#book" id="mBook" data-car=""
              ><span data-i18n="book_car"></span>
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" /></svg
            ></a>
          </div>
        </div>
      </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <a class="float" data-wa aria-label="WhatsApp">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
      </svg>
      <span>WhatsApp</span>
